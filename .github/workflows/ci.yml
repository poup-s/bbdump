name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Electron 44 requires Node >= 22.12
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-postgres/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vue-tsc + vite)
        run: npm run build

      - name: Lint (fails on errors only)
        run: npx eslint src/

      - name: Build and bundle the MCP server
        run: npm run bundle:mcp

      - name: Tests (app and MCP server helpers)
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
